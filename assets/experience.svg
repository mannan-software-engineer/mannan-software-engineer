<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Career: Senior Backend Developer at Crypthon Technologies (2025–present), Associate Python Developer at Revocode (2024–2025), Python Automation Engineer at BlitzCoFluence (2023–2024), BS Computer Science">
