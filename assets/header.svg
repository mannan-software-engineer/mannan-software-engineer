<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Abdul Mannan, Senior Backend Developer: I build backend systems that scale without breaking.">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: Inter,'Segoe UI',Helvetica,Arial,sans-serif; }
    .line { opacity: 0; animation: show .35s ease-out forwards; }
    .l1 { animation-delay: .2s; } .l2 { animation-delay: .7s; } .l3 { animation-delay: 1.3s; }
    .l4 { animation-delay: 1.8s; } .l5 { animation-delay: 2.4s; } .l6 { animation-delay: 2.9s; }
    .l7 { animation-delay: 3.4s; }
    .cursor { animation: blink 1s steps(1) infinite; animation-delay: 3.4s; }
    @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#111a2c" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="80%" cy="10%" r="60%">
      <stop offset="0" stop-color="#34d399" stop-opacity=".22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="5%" cy="100%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="360" rx="18" fill="#070a12"/>
  <rect width="1000" height="360" rx="18" fill="url(#grid)"/>
  <rect class="glow" width="1000" height="360" rx="18" fill="url(#halo)"/>
  <rect width="1000" height="360" rx="18" fill="url(#halo2)"/>

  <!-- terminal window -->
  <rect x="40" y="34" width="920" height="292" rx="12" fill="#0b1120" stroke="#1a2336"/>
  <path d="M40 46a12 12 0 0 1 12-12h896a12 12 0 0 1 12 12v24H40z" fill="#0f1729"/>
  <line x1="40" y1="70" x2="960" y2="70" stroke="#1a2336"/>
  <circle cx="64" cy="52" r="6" fill="#ff5f57"/>
  <circle cx="84" cy="52" r="6" fill="#febc2e"/>
  <circle cx="104" cy="52" r="6" fill="#28c840"/>
  <text x="500" y="57" text-anchor="middle" class="mono" font-size="13" fill="#7d8aa3">~/platform — zsh</text>

  <!-- prompt 1 -->
  <g class="line l1">
    <text x="70" y="106" class="mono" font-size="16"><tspan fill="#34d399">➜</tspan><tspan fill="#22d3ee" dx="10">~/platform</tspan><tspan fill="#e6edf3" dx="10">whoami</tspan></text>
  </g>
  <g class="line l2">
    <text x="70" y="150" class="sans" font-size="38" font-weight="800" fill="url(#nameGrad)">Abdul Mannan</text>
    <text x="352" y="149" class="mono" font-size="17" fill="#7d8aa3">// Senior Backend Developer · Lahore, PK</text>
  </g>

  <!-- prompt 2 -->
  <g class="line l3">
    <text x="70" y="192" class="mono" font-size="16"><tspan fill="#34d399">➜</tspan><tspan fill="#22d3ee" dx="10">~/platform</tspan><tspan fill="#e6edf3" dx="10">cat mission.txt</tspan></text>
  </g>
  <g class="line l4">
    <text x="70" y="220" class="mono" font-size="17" fill="#a7f3d0">I build backend systems that scale without breaking.</text>
  </g>

  <!-- prompt 3 -->
  <g class="line l5">
    <text x="70" y="260" class="mono" font-size="16"><tspan fill="#34d399">➜</tspan><tspan fill="#22d3ee" dx="10">~/platform</tspan><tspan fill="#e6edf3" dx="10">kubectl get stack</tspan></text>
  </g>
  <g class="line l6">
    <text x="70" y="288" class="mono" font-size="15" fill="#c9d4e5">FastAPI <tspan fill="#34d399">·</tspan> Django <tspan fill="#34d399">·</tspan> PostgreSQL <tspan fill="#34d399">·</tspan> Redis <tspan fill="#34d399">·</tspan> Celery <tspan fill="#34d399">·</tspan> Kubernetes <tspan fill="#34d399">·</tspan> Helm <tspan fill="#34d399">·</tspan> AWS</text>
  </g>

  <!-- prompt 4 with cursor -->
  <g class="line l7">
    <text x="70" y="314" class="mono" font-size="16"><tspan fill="#34d399">➜</tspan><tspan fill="#22d3ee" dx="10">~/platform</tspan></text>
    <rect class="cursor" x="196" y="300" width="10" height="18" fill="#34d399"/>
  </g>

  <!-- status pill -->
  <g transform="translate(790 92)">
    <rect width="148" height="28" rx="14" fill="#0c1f1a" stroke="#14532d"/>
    <circle class="glow" cx="18" cy="14" r="5" fill="#34d399"/>
    <text x="32" y="19" class="mono" font-size="12" fill="#6ee7b7">open to remote</text>
  </g>
</svg>
