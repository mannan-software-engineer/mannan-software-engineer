<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Abdul Mannan, Senior Backend Developer. I build backend systems that scale without breaking.">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: Inter,'Segoe UI',Helvetica,Arial,sans-serif; }
    .in { opacity: 0; animation: in .5s ease-out forwards; }
    .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}
    .row { opacity: 0; animation: in .3s ease-out forwards; }
    .p1{animation-delay:.9s}.p2{animation-delay:1.05s}.p3{animation-delay:1.2s}.p4{animation-delay:1.35s}
    .p5{animation-delay:1.5s}.p6{animation-delay:1.65s}.p7{animation-delay:1.8s}.p8{animation-delay:1.95s}.p9{animation-delay:2.2s}
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .live { animation: pulse 1.8s ease-in-out infinite; }
    .live.b { animation-delay: .6s; } .live.c { animation-delay: 1.2s; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .orb { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-40px,20px); } }
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(300px); } }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f1728" stroke-width="1"/>
    </pattern>
    <radialGradient id="g1"><stop offset="0" stop-color="#34d399" stop-opacity=".32"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".7"/><stop offset=".5" stop-color="#1a2336"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".5"/></linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset="1" stop-color="#34d399" stop-opacity=".08"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070a12" stop-opacity="0"/><stop offset="1" stop-color="#070a12"/></linearGradient>
    <clipPath id="term"><rect x="548" y="88" width="404" height="282"/></clipPath>
    <clipPath id="all"><rect width="1000" height="420" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#all)">
    <rect width="1000" height="420" fill="#070a12"/>
    <rect width="1000" height="420" fill="url(#grid)"/>
    <rect y="300" width="1000" height="120" fill="url(#fade)"/>
    <circle class="orb" cx="820" cy="40" r="260" fill="url(#g1)"/>
    <circle cx="60" cy="420" r="240" fill="url(#g2)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="419" rx="20" fill="none" stroke="#141d2f"/>

  <!-- ============ LEFT ============ -->
  <g class="in d1">
    <rect x="50" y="52" width="232" height="30" rx="15" fill="#0b1322" stroke="#1a2336"/>
    <circle class="live" cx="68" cy="67" r="4.5" fill="#34d399"/>
    <text x="82" y="71.5" class="mono" font-size="12" fill="#9aa7bd">Senior Backend Developer</text>
  </g>
  <g class="in d2">
    <text x="46" y="158" class="sans" font-size="76" font-weight="800" letter-spacing="-2" fill="#e6edf3">Abdul</text>
  </g>
  <g class="in d3">
    <text x="46" y="234" class="sans" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#name)">Mannan<tspan fill="#e6edf3">.</tspan></text>
  </g>
  <g class="in d4">
    <text x="50" y="280" class="sans" font-size="19" fill="#c9d4e5">I build backend systems that</text>
    <text x="50" y="306" class="sans" font-size="19" fill="#c9d4e5"><tspan font-weight="700" fill="#6ee7b7">scale</tspan> without <tspan font-weight="700" fill="#6ee7b7">breaking</tspan>.</text>
  </g>
  <g class="in d5 mono" font-size="12">
    <rect x="50" y="338" width="122" height="30" rx="8" fill="#0b1322" stroke="#1a2336"/>
    <text x="111" y="357" text-anchor="middle" fill="#9aa7bd"><tspan fill="#34d399">◆</tspan> FastAPI</text>
    <rect x="180" y="338" width="134" height="30" rx="8" fill="#0b1322" stroke="#1a2336"/>
    <text x="247" y="357" text-anchor="middle" fill="#9aa7bd"><tspan fill="#22d3ee">◆</tspan> Kubernetes</text>
    <rect x="322" y="338" width="150" height="30" rx="8" fill="#0b1322" stroke="#1a2336"/>
    <text x="397" y="357" text-anchor="middle" fill="#9aa7bd"><tspan fill="#fbbf24">◆</tspan> Lahore · UTC+5</text>
  </g>

  <!-- ============ RIGHT: cluster panel ============ -->
  <g class="in d3">
    <rect x="531" y="41" width="438" height="346" rx="15" fill="url(#edge)"/>
    <rect x="532" y="42" width="436" height="344" rx="14" fill="#0a0f1c"/>
    <path d="M532 56a14 14 0 0 1 14-14h408a14 14 0 0 1 14 14v20H532z" fill="#0e1527"/>
    <line x1="532" y1="76" x2="968" y2="76" stroke="#1a2336"/>
    <circle cx="554" cy="59" r="5.5" fill="#ff5f57"/><circle cx="572" cy="59" r="5.5" fill="#febc2e"/><circle cx="590" cy="59" r="5.5" fill="#28c840"/>
    <text x="750" y="63" text-anchor="middle" class="mono" font-size="12" fill="#7d8aa3">~/platform — zsh</text>
    <g transform="translate(900 50)">
      <rect width="56" height="18" rx="9" fill="#0c1f1a" stroke="#14532d"/>
      <text x="28" y="13" text-anchor="middle" class="mono" font-size="10" fill="#6ee7b7">prod</text>
    </g>
  </g>

  <g clip-path="url(#term)">
    <rect class="scan" x="548" y="-40" width="404" height="60" fill="url(#scanG)"/>
  </g>

  <g class="mono" font-size="12.5">
    <g class="row p1">
      <text x="552" y="106"><tspan fill="#34d399">➜</tspan><tspan fill="#22d3ee" dx="8">~/platform</tspan><tspan fill="#e6edf3" dx="8">kubectl get pods -n prod</tspan></text>
    </g>
    <g class="row p1" fill="#5d6a82" font-size="11">
      <text x="552" y="134">NAME</text><text x="740" y="134">READY</text><text x="800" y="134">STATUS</text><text x="920" y="134">AGE</text>
    </g>
    <g class="row p2"><text x="552" y="160" fill="#e6edf3">api-6f9c8d-x2kq</text><text x="740" y="160" fill="#9aa7bd">2/2</text><circle class="live" cx="804" cy="156" r="3.5" fill="#34d399"/><text x="814" y="160" fill="#6ee7b7">Running</text><text x="920" y="160" fill="#7d8aa3">41d</text></g>
    <g class="row p3"><text x="552" y="184" fill="#e6edf3">api-6f9c8d-m7tz</text><text x="740" y="184" fill="#9aa7bd">2/2</text><circle class="live b" cx="804" cy="180" r="3.5" fill="#34d399"/><text x="814" y="184" fill="#6ee7b7">Running</text><text x="920" y="184" fill="#7d8aa3">41d</text></g>
    <g class="row p4"><text x="552" y="208" fill="#e6edf3">ws-gateway-5d7b</text><text x="740" y="208" fill="#9aa7bd">1/1</text><circle class="live c" cx="804" cy="204" r="3.5" fill="#34d399"/><text x="814" y="208" fill="#6ee7b7">Running</text><text x="920" y="208" fill="#7d8aa3">12d</text></g>
    <g class="row p5"><text x="552" y="232" fill="#e6edf3">celery-worker-q8</text><text x="740" y="232" fill="#9aa7bd">3/3</text><circle class="live" cx="804" cy="228" r="3.5" fill="#34d399"/><text x="814" y="232" fill="#6ee7b7">Running</text><text x="920" y="232" fill="#7d8aa3">9d</text></g>
    <g class="row p6"><text x="552" y="256" fill="#e6edf3">pgbouncer-0</text><text x="740" y="256" fill="#9aa7bd">2/2</text><circle class="live b" cx="804" cy="252" r="3.5" fill="#34d399"/><text x="814" y="256" fill="#6ee7b7">Running</text><text x="920" y="256" fill="#7d8aa3">63d</text></g>
    <g class="row p7"><text x="552" y="280" fill="#e6edf3">postgres-0</text><text x="740" y="280" fill="#9aa7bd">1/1</text><circle class="live c" cx="804" cy="276" r="3.5" fill="#34d399"/><text x="814" y="280" fill="#6ee7b7">Running</text><text x="920" y="280" fill="#7d8aa3">63d</text></g>
    <g class="row p8"><text x="552" y="304" fill="#e6edf3">redis-0</text><text x="740" y="304" fill="#9aa7bd">1/1</text><circle class="live" cx="804" cy="300" r="3.5" fill="#34d399"/><text x="814" y="304" fill="#6ee7b7">Running</text><text x="920" y="304" fill="#7d8aa3">63d</text></g>
    <g class="row p9">
      <text x="552" y="340"><tspan fill="#34d399">➜</tspan><tspan fill="#22d3ee" dx="8">~/platform</tspan><tspan fill="#e6edf3" dx="8">echo "all systems nominal"</tspan></text>
      <text x="552" y="364" fill="#6ee7b7">all systems nominal</text>
      <rect class="cursor" x="700" y="353" width="8" height="15" fill="#34d399"/>
    </g>
  </g>
</svg>
