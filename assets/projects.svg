<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Selected work: GrabnGo cross-border marketplace, Laen Daen fintech ledger, Hunger Delights food-tech reservations">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: Inter,'Segoe UI',Helvetica,Arial,sans-serif; }
    .card { opacity: 0; animation: up .5s ease-out forwards; }
    .c1 { animation-delay: .1s; } .c2 { animation-delay: .3s; } .c3 { animation-delay: .5s; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
  <defs>
    <linearGradient id="top" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="400" rx="16" fill="#070a12"/>

  <text x="22" y="30" class="mono" font-size="14"><tspan fill="#34d399">➜</tspan><tspan fill="#22d3ee" dx="8">~/work</tspan><tspan fill="#e6edf3" dx="8">kubectl get projects -o wide</tspan></text>

  <!-- GrabnGo -->
  <g class="card c1" transform="translate(10 50)">
    <rect width="310" height="334" rx="14" fill="#0b1120" stroke="#1a2336"/>
    <rect x="16" y="0" width="278" height="2" rx="1" fill="url(#top)"/>
    <circle class="dot" cx="26" cy="32" r="5" fill="#34d399"/>
    <text x="38" y="36" class="mono" font-size="11" fill="#6ee7b7">Running</text>
    <text x="290" y="36" text-anchor="end" class="mono" font-size="11" fill="#7d8aa3">grabngo.com.pk</text>
    <text x="20" y="76" class="sans" font-size="24" font-weight="800" fill="#e6edf3">GrabnGo</text>
    <text x="20" y="98" class="mono" font-size="12" fill="#34d399">cross-border marketplace</text>
    <text x="20" y="132" class="sans" font-size="13.5" fill="#9aa7bd">
      <tspan x="20" dy="0">Real-time matching between travelers</tspan>
      <tspan x="20" dy="20">and shoppers over WebSockets + Celery,</tspan>
      <tspan x="20" dy="20">JWT / RBAC auth, object storage, and</tspan>
      <tspan x="20" dy="20">autoscaling on Kubernetes.</tspan>
    </text>
    <rect x="20" y="226" width="270" height="1" fill="#1a2336"/>
    <text x="20" y="256" class="sans" font-size="26" font-weight="800" fill="#e6edf3">47</text>
    <text x="20" y="278" class="mono" font-size="12" fill="#7d8aa3">countries live · iOS + Android</text>
    <g class="mono" font-size="11" transform="translate(20 292)">
      <rect width="66" height="22" rx="6" fill="#111a2c" stroke="#1f2a40"/><text x="33" y="15" text-anchor="middle" fill="#c9d4e5">FastAPI</text>
      <rect x="72" width="88" height="22" rx="6" fill="#111a2c" stroke="#1f2a40"/><text x="116" y="15" text-anchor="middle" fill="#c9d4e5">WebSockets</text>
      <rect x="166" width="56" height="22" rx="6" fill="#111a2c" stroke="#1f2a40"/><text x="194" y="15" text-anchor="middle" fill="#c9d4e5">Celery</text>
      <rect x="228" width="42" height="22" rx="6" fill="#111a2c" stroke="#1f2a40"/><text x="249" y="15" text-anchor="middle" fill="#c9d4e5">K8s</text>
    </g>
  </g>

  <!-- Laen Daen -->
  <g class="card c2" transform="translate(345 50)">
    <rect width="310" height="334" rx="14" fill="#0b1120" stroke="#1a2336"/>
    <rect x="16" y="0" width="278" height="2" rx="1" fill="url(#top)"/>
    <circle class="dot" cx="26" cy="32" r="5" fill="#34d399"/>
    <text x="38" y="36" class="mono" font-size="11" fill="#6ee7b7">Running</text>
    <text x="290" y="36" text-anchor="end" class="mono" font-size="11" fill="#7d8aa3">laendaen.com</text>
    <text x="20" y="76" class="sans" font-size="24" font-weight="800" fill="#e6edf3">Laen Daen</text>
    <text x="20" y="98" class="mono" font-size="12" fill="#34d399">fintech digital ledger</text>
    <text x="20" y="132" class="sans" font-size="13.5" fill="#9aa7bd">
      <tspan x="20" dy="0">Invoicing, budgeting and wallet REST</tspan>
      <tspan x="20" dy="20">APIs with payment-gateway integration,</tspan>
      <tspan x="20" dy="20">Celery / Redis background jobs, shipped</tspan>
      <tspan x="20" dy="20">with Docker + GitHub Actions.</tspan>
    </text>
    <rect x="20" y="226" width="270" height="1" fill="#1a2336"/>
    <text x="20" y="256" class="sans" font-size="26" font-weight="800" fill="#e6edf3">20K+</text>
    <text x="20" y="278" class="mono" font-size="12" fill="#7d8aa3">users · iOS + Android</text>
    <g class="mono" font-size="11" transform="translate(20 292)">
      <rect width="66" height="22" rx="6" fill="#111a2c" stroke="#1f2a40"/><text x="33" y="15" text-anchor="middle" fill="#c9d4e5">FastAPI</text>
      <rect x="72" width="52" height="22" rx="6" fill="#111a2c" stroke="#1f2a40"/><text x="98" y="15" text-anchor="middle" fill="#c9d4e5">Redis</text>
      <rect x="130" width="56" height="22" rx="6" fill="#111a2c" stroke="#1f2a40"/><text x="158" y="15" text-anchor="middle" fill="#c9d4e5">Celery</text>
      <rect x="192" width="60" height="22" rx="6" fill="#111a2c" stroke="#1f2a40"/><text x="222" y="15" text-anchor="middle" fill="#c9d4e5">Docker</text>
    </g>
  </g>

  <!-- Hunger Delights -->
  <g class="card c3" transform="translate(680 50)">
    <rect width="310" height="334" rx="14" fill="#0b1120" stroke="#1a2336"/>
    <rect x="16" y="0" width="278" height="2" rx="1" fill="url(#top)"/>
    <circle class="dot" cx="26" cy="32" r="5" fill="#34d399"/>
    <text x="38" y="36" class="mono" font-size="11" fill="#6ee7b7">Running</text>
    <text x="290" y="36" text-anchor="end" class="mono" font-size="11" fill="#7d8aa3">food-tech</text>
    <text x="20" y="76" class="sans" font-size="24" font-weight="800" fill="#e6edf3">Hunger Delights</text>
    <text x="20" y="98" class="mono" font-size="12" fill="#34d399">reservations &amp; ordering</text>
    <text x="20" y="132" class="sans" font-size="13.5" fill="#9aa7bd">
      <tspan x="20" dy="0">Restaurant, menu and booking backend</tspan>
      <tspan x="20" dy="20">with live updates over WebSockets, a</tspan>
      <tspan x="20" dy="20">tuned PostgreSQL menu schema, and</tspan>
      <tspan x="20" dy="20">Celery / Redis notifications.</tspan>
    </text>
    <rect x="20" y="226" width="270" height="1" fill="#1a2336"/>
    <text x="20" y="256" class="sans" font-size="26" font-weight="800" fill="#e6edf3">&lt;100ms</text>
    <text x="20" y="278" class="mono" font-size="12" fill="#7d8aa3">menu retrieval</text>
    <g class="mono" font-size="11" transform="translate(20 292)">
      <rect width="88" height="22" rx="6" fill="#111a2c" stroke="#1f2a40"/><text x="44" y="15" text-anchor="middle" fill="#c9d4e5">WebSockets</text>
      <rect x="94" width="88" height="22" rx="6" fill="#111a2c" stroke="#1f2a40"/><text x="138" y="15" text-anchor="middle" fill="#c9d4e5">PostgreSQL</text>
      <rect x="188" width="56" height="22" rx="6" fill="#111a2c" stroke="#1f2a40"/><text x="216" y="15" text-anchor="middle" fill="#c9d4e5">Celery</text>
    </g>
  </g>
</svg>
