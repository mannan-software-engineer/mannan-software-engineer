<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Career: BS Computer Science; Python Automation Engineer at BlitzCoFluence (Nov 2023); Associate Python Developer at Revocode (May 2024); Senior Backend Developer at Crypthon Technologies (Feb 2025 to present)">
<style>
.mono { font-family: 'JetBrains Mono','Fira Code',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
.sans { font-family: Inter,'Segoe UI',Helvetica,Arial,sans-serif; }
.card { opacity: 0; animation: up .5s ease-out forwards; }
.c0{animation-delay:.1s}.c1{animation-delay:.3s}.c2{animation-delay:.5s}.c3{animation-delay:.7s}
@keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.ring { animation: ring 2s ease-out infinite; transform-origin: 866px 128px; }
@keyframes ring { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
.comet { animation: comet 3.5s ease-in-out infinite; }
@keyframes comet { from { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateX(760px); opacity: 0; } }
</style>
<defs>
